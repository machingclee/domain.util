# Publish com.machingclee:domain-util to Maven Central (Sonatype Central Portal).
#
# Required repository secrets:
#   CENTRAL_TOKEN_USERNAME  – Portal user token username
#   CENTRAL_TOKEN_PASSWORD  – Portal user token password
#   GPG_PRIVATE_KEY         – armored private key (gpg --export-secret-keys --armor KEYID)
#   GPG_PASSPHRASE          – passphrase for that key
#
# Trigger: version tags (v*) or manual "Run workflow".

name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Deploy to Maven Central
        run: mvn -B clean deploy -DskipTests -Dcentral.autoPublish=true
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
